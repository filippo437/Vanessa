<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Vanessa</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#dbe8ff}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#msg{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 18px);text-align:center;font-size:14px;color:#8fa3d6;min-height:20px}
#mic{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 36px);transform:translateX(-50%);width:76px;height:76px;border-radius:50%;border:2px solid #3d8bff;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
#mic svg{width:32px;height:32px;fill:none;stroke:#3d8bff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mic.on{background:#3d8bff}#mic.on svg{stroke:#00091f}
#gear{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 54px);width:44px;height:44px;border:none;background:transparent;padding:0}
#gear svg{width:26px;height:26px;fill:none;stroke:#8fa3d6;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#set{position:absolute;inset:0;background:rgba(0,0,0,.94);display:none;flex-direction:column;justify-content:center;gap:12px;padding:24px;box-sizing:border-box}
#set.show{display:flex}
#set h2{margin:0 0 4px;font-size:18px;font-weight:600}
#set p{margin:0;font-size:13px;line-height:1.5;color:#8fa3d6}
#set input{min-height:48px;border-radius:10px;border:1px solid #2a3270;background:#0a0d24;color:#dbe8ff;font-size:16px;padding:0 12px}
#set button{min-height:48px;border-radius:24px;border:1px solid #3d8bff;background:transparent;color:#dbe8ff;font-size:16px}
#set button.pri{background:#3d8bff;color:#00091f}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"></div>
<button id="gear" aria-label="Impostazioni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
<button id="mic" aria-label="Parla con Vanessa"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<div id="set">
<h2>Impostazioni</h2>
<p>Incolla qui la tua chiave API di Claude. Resta salvata solo su questo telefono. Usa una chiave dedicata e metti un limite di spesa nella console di Anthropic.</p>
<input id="key" type="password" placeholder="sk-ant-..." autocomplete="off" autocapitalize="off" spellcheck="false">
<button class="pri" id="save">Salva</button>
<button id="forget">Cancella la memoria di Vanessa</button>
<button id="close">Chiudi</button>
</div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W=0,H=0,dpr=1;
function size(){dpr=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',size);size();
const N=3200,P=[],ga=Math.PI*(3-Math.sqrt(5));
for(let i=0;i<N;i++){
  const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=ga*i;
  P.push({x:Math.cos(a)*r,y,z:Math.sin(a)*r,s:.8+Math.random()*.2,h:Math.random(),ph:Math.random()*6.283,sz:Math.random()<.12?2.6:1.1});
}
const L=[],X=new Float32Array(N),Y=new Float32Array(N);
for(let i=0;i<N;i+=2){
  let b1=-1,d1=9;
  for(let j=0;j<N;j++){
    if(j===i)continue;
    const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,dz=P[i].z-P[j].z,d=dx*dx+dy*dy+dz*dz;
    if(d<d1){d1=d;b1=j}
  }
  L.push(i,b1);
  for(let n=0;n<30;n++){
    const j=Math.floor(Math.random()*N);
    const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,dz=P[i].z-P[j].z,d=dx*dx+dy*dy+dz*dz;
    if(d>.03&&d<.16){L.push(i,j);break}
  }
}
let state='idle',level=0,rot=0,t=0,an=null,anBuf=null,actx=null,serverVoiceOff=false;
function voiceRms(){an.getByteTimeDomainData(anBuf);let q=0;for(let i=0;i<anBuf.length;i++){const v=(anBuf[i]-128)/128;q+=v*v}return Math.sqrt(q/anBuf.length)}
function setState(s){state=s}
function frame(){
  t+=.016;
  const target=state==='speaking'?(an?Math.min(1,.15+voiceRms()*4.5):Math.min(1,.55+.45*Math.abs(Math.sin(t*2.2)*Math.sin(t*.9+1)+.3*Math.sin(t*3.1)))):state==='thinking'?.22+.08*Math.sin(t*4):0;
  level+=(target-level)*.035;
  rot+=.002+level*.0012;
  cx.clearRect(0,0,W,H);
  const R=Math.min(W,H)*.2,cxp=W/2,cyp=H*.42,cr=Math.cos(rot),sr=Math.sin(rot);
  const breath=1+.015*Math.sin(t*1.5);
  for(let i=0;i<N;i++){
    const p=P[i];
    const wob=.5+.5*Math.sin(t*1.2+p.ph);
    const k=R*breath*(p.s+level*(.3+1.7*p.h)*1.3*wob);
    const x0=p.x*cr-p.z*sr,z0=p.x*sr+p.z*cr,y0=p.y;
    const sc=1/(1.6-z0*.5);
    const px=cxp+x0*k*sc*1.6,py=cyp+y0*k*sc*1.6;
    X[i]=px;Y[i]=py;
    const depth=(z0+1)/2;
    const al=.25+depth*.6+level*.15;
    const hue=212+p.h*14;
    cx.fillStyle='hsla('+hue+',100%,'+(52+depth*18+level*8)+'%,'+Math.min(al,1)+')';
    const z=p.sz*(.7+depth*.6);
    cx.beginPath();cx.arc(px,py,z*.45,0,6.2832);cx.fill();
  }
  cx.strokeStyle='rgba(50,130,255,'+(.08+level*.2)+')';cx.lineWidth=.6;cx.beginPath();
  for(let k=0;k<L.length;k+=2){cx.moveTo(X[L[k]],Y[L[k]]);cx.lineTo(X[L[k+1]],Y[L[k+1]])}
  cx.stroke();
  requestAnimationFrame(frame);
}
frame();


// ---------------- LOGICA DEL TELEFONO ----------------
const MODEL='claude-sonnet-5-5';
const $=id=>document.getElementById(id);
const msg=$('msg'),mic=$('mic'),setp=$('set');
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function note(t,ms){msg.textContent=t||'';if(t&&ms)setTimeout(()=>{if(msg.textContent===t)msg.textContent=''},ms)}
function memory(){try{return JSON.parse(store.get('vanessa_mem','[]'))}catch(e){return[]}}
function saveMemory(m){store.set('vanessa_mem',JSON.stringify(m))}
function system(){
  let s="Sei Vanessa, l'assistente vocale personale di Filippo. Sei una donna: usa il femminile quando parli di te. "+
  "Rispondi sempre in italiano, in modo naturale e conciso: una, massimo tre frasi. "+
  "Le risposte vengono lette ad alta voce, quindi niente elenchi, markdown, emoji o simboli. "+
  "Tono cortese, intelligente e con un pizzico di ironia. "+
  "Se Filippo ti dice un fatto importante su di se o ti chiede di ricordare qualcosa, usa lo strumento ricorda. "+
  "Non puoi aprire programmi: sei sul telefono. Dopo uno strumento conferma in modo brevissimo.";
  s+="\nOra: "+new Date().toLocaleString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})+".";
  const m=memory();if(m.length)s+="\nCose che sai su Filippo:\n- "+m.join("\n- ");
  return s;
}
const TOOLS=[
  {name:'ricorda',description:'Salva in memoria un\'informazione su Filippo da ricordare nei giorni successivi.',input_schema:{type:'object',properties:{informazione:{type:'string'}},required:['informazione']}},
  {name:'dimentica',description:'Cancella dalla memoria le informazioni che contengono il testo indicato.',input_schema:{type:'object',properties:{testo:{type:'string'}},required:['testo']}}
];
function runTool(n,a){
  if(n==='ricorda'){const m=memory();m.push(String(a.informazione||'').trim());saveMemory(m);return 'Salvato.'}
  if(n==='dimentica'){const t=String(a.testo||'').toLowerCase(),m=memory(),k=m.filter(x=>!x.toLowerCase().includes(t));saveMemory(k);return 'Cancellate '+(m.length-k.length)+' informazioni.'}
  return 'Strumento sconosciuto.';
}
async function callClaude(key,msgs){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:MODEL,max_tokens:400,system:system(),messages:msgs,tools:TOOLS})});
  if(!r.ok){const e=new Error('http '+r.status);e.status=r.status;throw e}
  return r.json();
}
let hist=[];
async function ask(text){
  const key=store.get('vanessa_apikey','');
  if(!key){say('Prima devi inserire la chiave nelle impostazioni.');setp.classList.add('show');return}
  setState('thinking');note('...');
  hist.push({role:'user',content:text});
  while(hist.length>16)hist.shift();
  const msgs=hist.slice();let reply='';
  try{
    for(let i=0;i<5;i++){
      const r=await callClaude(key,msgs);
      if(r.stop_reason==='tool_use'){
        msgs.push({role:'assistant',content:r.content});
        msgs.push({role:'user',content:r.content.filter(b=>b.type==='tool_use').map(b=>({type:'tool_result',tool_use_id:b.id,content:runTool(b.name,b.input)}))});
        continue;
      }
      reply=r.content.filter(b=>b.type==='text').map(b=>b.text).join('');break;
    }
    hist.push({role:'assistant',content:reply||'Fatto.'});
    note('');say(reply||'Fatto.');
  }catch(e){
    hist.pop();
    const t=e.status===401?'La chiave non è valida. Controllala nelle impostazioni.':e.status===429?'Troppe richieste, riprova tra poco.':'Non riesco a collegarmi. Controlla internet.';
    note(t,6000);say(t);
  }
}
// ---- voce ----
let voice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith('it'));
  voice=vs.find(v=>/female|donna|elsa|isabella|alice|federica/i.test(v.name))||vs[0]||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text){
  setState('speaking');mic.classList.remove('on');
  let done=false;
  const end=()=>{if(done)return;done=true;setState('idle')};
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='it-IT';if(voice)u.voice=voice;
    u.onend=end;u.onerror=end;speechSynthesis.speak(u);
    setTimeout(end,Math.min(60000,3000+text.length*110));
  }catch(e){setTimeout(end,3000)}
}
// ---- microfono ----
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
mic.addEventListener('click',()=>{
  if(state==='speaking'){try{speechSynthesis.cancel()}catch(e){}setState('idle');return}
  if(state==='listening'){try{rec.abort()}catch(e){}mic.classList.remove('on');setState('idle');return}
  if(state==='thinking')return;
  if(!SR){note('Questo browser non supporta il microfono. Apri la pagina con Chrome.',7000);return}
  try{
    rec=new SR();rec.lang='it-IT';rec.continuous=false;rec.interimResults=false;
    rec.onresult=e=>{const tx=e.results[0][0].transcript.trim();mic.classList.remove('on');if(tx)ask(tx);else setState('idle')};
    rec.onerror=ev=>{mic.classList.remove('on');setState('idle');if(ev.error==='not-allowed'||ev.error==='service-not-allowed')note('Consenti il microfono a Chrome per usare Vanessa.',7000);else if(ev.error==='no-speech')note('Non ho sentito niente.',3000)};
    rec.onend=()=>{if(state==='listening'){mic.classList.remove('on');setState('idle')}};
    rec.start();mic.classList.add('on');setState('listening');note('');
  }catch(e){setState('idle');mic.classList.remove('on')}
});
// ---- impostazioni ----
$('gear').addEventListener('click',()=>{$('key').value='';setp.classList.add('show')});
$('close').addEventListener('click',()=>setp.classList.remove('show'));
$('save').addEventListener('click',()=>{const k=$('key').value.trim();if(k){store.set('vanessa_apikey',k);note('Chiave salvata.',3000)}setp.classList.remove('show')});
$('forget').addEventListener('click',()=>{saveMemory([]);hist=[];note('Memoria cancellata.',3000);setp.classList.remove('show')});
if(!store.get('vanessa_apikey',''))setp.classList.add('show');
</script>
</body>
</html>
